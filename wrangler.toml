name = "seoul-explore-go"
compatibility_date = "2026-01-01"

# Cloudflare Pages를 기본 배포 대상으로 사용한다.
# 이 파일은 Workers Static Assets가 다시 필요해질 때의 대안 설정으로 유지한다.
main = "worker/index.ts"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 후속 기능에서 서버 저장 코스, 영구 공유 링크, 계정 기능이 필요해지면
# D1 바인딩과 migrations_dir를 서울고 스키마 기준으로 다시 추가한다.
